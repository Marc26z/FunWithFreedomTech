name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Clean install dependencies
        # Install exactly what package-lock.json resolves so CI matches local
        # builds. Deleting the lockfile pulled newer semver-compatible releases
        # (e.g. nostr-tools 2.15 -> 2.26, which changed nip57.makeZapRequest's
        # signature) and broke `tsc` even though the code is fine.
        run: npm ci

      - name: Run tests
        run: npm run test